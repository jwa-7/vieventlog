<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitovent Lüftung - ViEventLog</title>
    <link rel="stylesheet" href="/static/css/vitovent.css">
    <script src="/static/js/menu-visibility.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div>
                    <h1>🌬️ Vitovent Lüftung</h1>
                    <div class="breadcrumb">
                        <a href="/">← Events</a>
                        <span>/</span>
                        <a href="/dashboard">Dashboard</a>
                        <span>/</span>
                        <span id="currentInstallation">Loading...</span>
                    </div>
                </div>
                <div class="last-update">
                    Letzte Aktualisierung: <span id="lastUpdate">-</span>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="install-select">
                <label>Installation:</label>
                <select id="installationSelect">
                    <option>Lade...</option>
                </select>
            </div>
            <div class="button-group">
                <button id="refreshBtn">🔄 Aktualisieren</button>
                <a href="/smartclimate" class="nav-link" data-menu-item="smartclimate">🏠 SmartClimate</a>
                <a href="/vitocharge" class="nav-link" data-menu-item="vitocharge">⚡ Vitocharge VX3</a>
            </div>
        </div>

        <div id="errorContainer"></div>
        <div id="vitoventContent" class="loading">
            <div class="spinner"></div>
            <p>Lade Vitovent-System...</p>
        </div>
    </div>

    <script src="/static/js/vitovent.js"></script>
</body>
</html>
